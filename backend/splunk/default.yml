# Splunk container defaults for the RASP SIEM lab.
# Applied on first boot via /tmp/defaults/default.yml
splunk:
  conf:
    - key: inputs
      value:
        directory: /opt/splunk/etc/apps/splunk_httpinput/local
        content:
          http:
            disabled: 0
            enableSSL: 1
          "http://rasp":
            disabled: 0
            token: 11111111-1111-1111-1111-111111111111
            index: rasp
            sourcetype: rasp:json
    - key: indexes
      value:
        directory: /opt/splunk/etc/apps/search/local
        content:
          rasp:
            homePath: $SPLUNK_DB/rasp/db
            coldPath: $SPLUNK_DB/rasp/colddb
            thawedPath: $SPLUNK_DB/rasp/thaweddb
            datatype: event
