services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rasp
      POSTGRES_PASSWORD: rasp
      POSTGRES_DB: rasp
    ports:
      - "5432:5432"
    volumes:
      - rasp-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rasp -d rasp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://rasp:rasp@db:5432/rasp
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:-}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-}
      SPLUNK_HEC_INDEX: ${SPLUNK_HEC_INDEX:-rasp}
      SPLUNK_HEC_SOURCE: ${SPLUNK_HEC_SOURCE:-rasp_webhook}
      SPLUNK_HEC_SOURCETYPE: ${SPLUNK_HEC_SOURCETYPE:-rasp:json}
      SPLUNK_HEC_VERIFY_SSL: ${SPLUNK_HEC_VERIFY_SSL:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  grafana:
    profiles: ["grafana"]
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rasp-siem.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - rasp-grafana-data:/var/lib/grafana
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  splunk:
    profiles: ["splunk"]
    image: splunk/splunk:9.3
    hostname: splunk
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: Chang3d!Rasp
      SPLUNK_HEC_TOKEN: "11111111-1111-1111-1111-111111111111"
      SPLUNK_GENERAL_TERMS: "--accept-sgt-current-at-splunk-com"
    ports:
      # Splunk Web (host 8001 — API already uses 8000)
      - "8001:8000"
      # HTTP Event Collector
      - "8088:8088"
    volumes:
      - rasp-splunk-data:/opt/splunk/var
      - ./splunk/default.yml:/tmp/defaults/default.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fk https://localhost:8088/services/collector/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

volumes:
  rasp-pg-data:
  rasp-grafana-data:
  rasp-splunk-data:
